# AGENTS §9 门禁：format / clippy / audit + test(native) + golden(gauss 容器)。
# 说明：`cargo test --all-features` 含 gauss 黄金层，缺 A 模式容器必红（§4.1
# 禁止跳过即绿）——故 CI 拆为 test(native) 与 golden(容器内实跑) 两个 job，
# 文本契约见 AGENTS §9（决策记录 2025-11-05 第二轮复审）。
#
# 工作目录约定：crate 在 spinduck/（仓库根无 Cargo.toml），故 defaults 设为
# spinduck；**git 操作（子模块）必须在仓库根**，逐步骤显式 `working-directory: .`
# ——否则 `git submodule update --init lib/ogsql-parser` 在 spinduck/ 下报
# pathspec 不匹配（CI run 42060549897 实测红）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # crate 在 spinduck/（仓库根无 Cargo.toml）
    working-directory: spinduck

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # fmt 只读 crate 内文件，不需要子模块
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init ogsql-parser submodule（path 依赖，编译必需；fastaas 为私有项目不拉取）
        working-directory: .
        run: git submodule update --init lib/ogsql-parser
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --tests -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init ogsql-parser submodule
        working-directory: .
        run: git submodule update --init lib/ogsql-parser
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features native

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      # 内核锚定（AGENTS §1：duckdb = "=1.10505.0"）带来的构建期依赖：
      # zip 6.0.0 是 libduckdb-sys 的 build-dependency（bundled 解压缩包用），
      # 不进运行时产物，也无法在不违反内核版本锚定的前提下漂浮升级。
      # 四条公告均为该构建期 zip 的解压/符号链接边界缺陷 → 显式忽略并留档
      # （决策与复评节奏见 docs/architecture.md「审计豁免」；内核升级 PR 时复评）。
      - name: cargo audit（构建期 zip 豁免清单）
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0429

  golden:
    # 黄金对比：复用 golden/gaussdb-docker compose（与本地完全同口径：
    # 自定义 entrypoint A 模式引导 + healthcheck 强校验 + 127.0.0.1 绑定）。
    # 口令由步骤内随机生成经 GS_PASSWORD/SPINDUCK_OG_PASSWORD 注入，不落仓库。
    runs-on: ubuntu-latest
    env:
      SPINDUCK_OG_HOST: 127.0.0.1
      SPINDUCK_OG_PORT: "5433"
      SPINDUCK_OG_USER: gaussdb
      SPINDUCK_OG_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Init ogsql-parser submodule
        working-directory: .
        run: git submodule update --init lib/ogsql-parser
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate one-off GaussDB password（仅本次 runner 生命周期）
        id: gspwd
        working-directory: .
        # 大写 A + 十六进制体 + 数字 + `@`：openGauss 口令校验要求四类字符齐全
        # （大写/小写/数字/特殊字符，见镜像 initdb 报错），长度 ≥8。`@` 与官方示例
        # `openGauss@123` 同类，且在 double-quote shell 上下文与 compose 插值中无需转义。
        # add-mask 让步骤 env 转储与后续日志一律打码（Actions 只自动掩码 secrets 上下文）。
        run: |
          pwd_value="A$(openssl rand -hex 12)9z@"
          echo "::add-mask::${pwd_value}"
          echo "value=${pwd_value}" >> "$GITHUB_OUTPUT"
      - name: Bring up A-mode container（compose 校验 datcompatibility=A 才 healthy）
        working-directory: golden/gaussdb-docker
        env:
          GS_PASSWORD: ${{ steps.gspwd.outputs.value }}
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' spinduck-gaussdb || true)
            [ "$st" = "healthy" ] && { echo "A-mode ready"; break; }
            [ "$i" = 60 ] && { docker logs spinduck-gaussdb | tail -50; exit 1; }
            sleep 5
          done
      - name: Run golden + gauss suites
        working-directory: spinduck
        env:
          SPINDUCK_OG_PASSWORD: ${{ steps.gspwd.outputs.value }}
        # 红时把参照侧的证据一起落进日志：容器 stdout、实例 pg_log、runner 侧
        # OOM 痕迹。此前一次 run 只留了客户端的 `[ENV-0020] connection closed`，
        # 无法区分"内核被 runner OOM kill"与"参照例程自身报错"（validation V21）。
        run: |
          set +e
          cargo test --features gauss -- --nocapture
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::group::gaussdb container stdout (tail 200)"
            docker logs --tail 200 spinduck-gaussdb || true
            echo "::endgroup::"
            echo "::group::gaussdb pg_log (2 newest files, tail 120)"
            docker exec spinduck-gaussdb bash -c \
              'ls -t /var/lib/opengauss/data/pg_log/*.log 2>/dev/null | head -2 | xargs -r tail -n 120' || true
            echo "::endgroup::"
            echo "::group::runner memory evidence"
            docker stats --no-stream spinduck-gaussdb || true
            free -m || true
            dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -30 || true
            echo "::endgroup::"
          fi
          exit "$rc"
