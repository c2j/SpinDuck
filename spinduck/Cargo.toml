[package]
name = "spinduck"
version = "0.1.21"
edition = "2021"
description = "GaussDB stored-procedure engine on DuckDB kernel"
license = "MIT OR Apache-2.0"

[lib]
name = "spinduck_core"
path = "src/lib.rs"

[[bin]]
name = "spinduck"
path = "src/bin/spinduck.rs"
required-features = ["cli"]

[features]
default = ["native"]
native = ["dep:duckdb"]
cli = ["dep:duckdb", "native"]
golden = ["native"]
gauss = ["dep:gaussdb", "native"]
# sha256 认证探针独立开关：不打开时 tests/gauss_sha256.rs 收集 0 个测试，
# 避免"三条断言因未连实例而直接返回"被读成通过（AGENTS §4.1 禁"跳过即绿"）。
gauss-sha256 = ["gauss"]

[dependencies]
ogsql-parser = { path = "../lib/ogsql-parser" }
duckdb = { version = "=1.10505.0", features = ["bundled"], optional = true }
# GaussDB/openGauss 线协议驱动：实现 sha256/md5-sha256/SM3 口令认证（纯 Rust
# `postgres` 不认，见 validation V24）。只开 `sync`（本仓库全同步，`gaussdb::sync::*`），
# `default-features = false` 关掉运行时与类型扩展 feature 以收窄依赖面；不开 TLS。
# rev 锁定与 hepta-dbcli 同基线；git 依赖不进 cargo audit 面，豁免登记见 CI workflow 注释。
gaussdb = { git = "https://github.com/c2j/rust-opengauss", rev = "b95ed0b96c1ccf11827dde24c8fdf778a1bdbc03", default-features = false, features = ["sync"], optional = true }
thiserror = "2"
# 嵌入 codeweb v0.9.9（docs/embeded-codeweb.md / plans/2026-11-14-embedded-codeweb.md）。
# `default-features = false` + `analyze`：只要纯库形态（无 CLI/TUI/serve/MCP/JSP/Java
# 编译面）。git 依赖不进 cargo audit 面，豁免登记见 CI workflow 注释（同 gaussdb 先例）。
codeweb = { git = "https://github.com/c2j/codeweb", tag = "v0.9.9", default-features = false, features = ["analyze"] }
# D9② 的 GBK 编码表（design §3.5）。版本与 lockfile 里既有的那一版逐字一致——它已由
# `ogsql-parser` 引入，故这条只是把传递依赖提为直接依赖，零新增 crate、零新 CVSS 面。
# 带 `fast`（默认）即 enough：只在读入时整文件解码，不做逐流增量。
encoding_rs = "=0.8.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "guard_types_name_parsing"
path = "tests/guard/guard_types_name_parsing.rs"

[[test]]
name = "guard_ir_in_list_empty"
path = "tests/guard/guard_ir_in_list_empty.rs"

[[test]]
name = "guard_tx_semantics"
path = "tests/guard/guard_tx_semantics.rs"

[[test]]
name = "guard_exec_native_prepared_cache"
path = "tests/guard/guard_exec_native_prepared_cache.rs"

[[test]]
name = "guard_execute_dynamic"
path = "tests/guard/guard_execute_dynamic.rs"

[[test]]
name = "guard_error_domain"
path = "tests/guard/guard_error_domain.rs"

[[test]]
name = "guard_sql_pipeline_parity"
path = "tests/guard/guard_sql_pipeline_parity.rs"

[[test]]
name = "guard_register_silent_drop"
path = "tests/guard/guard_register_silent_drop.rs"

[[test]]
name = "guard_patterns_outer_join_residual"
path = "tests/guard/guard_patterns_outer_join_residual.rs"

# CLI 契约层（AGENTS §4.1）跑真 `[[bin]] spinduck`，该 bin 要 `cli` feature。用
# required-features 而非 `#![cfg]`：后者在 `--features native` 下收集 0 条 = "跳过即绿"。
# CI 的 Test job 因此单步 `cargo test --features cli`（cli ⊇ native，覆盖面只增不减，
# 见 AGENTS §9 与 workflow 注释）。
[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]


[patch."https://github.com/c2j/ogsql-parser"]
# 把 codeweb 的 git ogsql-parser 重定向到本仓库子模块：进程内只能有一份
# parser（AGENTS §1 版本锁定；codeweb v0.9.9 与子模块同为 v0.11.0 = 13d9baa）。
ogsql-parser = { path = "../lib/ogsql-parser" }
