# SpinDuck 黄金对比用 GaussDB（openGauss 5.0.0，Oracle A 兼容模式）——自包含复现环境。
#
# 启动（首次约 40–60s 初始化）：
#   docker compose -f golden/gaussdb-docker/docker-compose.yml up -d
#
# 等待 healthy 并确认 A 模式：
#   docker compose -f golden/gaussdb-docker/docker-compose.yml ps
#   docker logs spinduck-gaussdb | grep spinduck-init
#
# 环境要点（与 lib/fastaas dota-adapter 交付脚本同源，见本目录入口脚本头部注释）：
#   - datcompatibility=A 由镜像 initdb 默认给出，healthcheck 强制校验
#   - openGauss 默认 sha256 SASL 纯 Rust postgres 驱动不识别；
#     md5 + password_encryption_type=1 使纯 Rust 客户端可用（仅开发环境）
#
# 连接信息（SpinDuck 测试/CLI）：
#   host: 127.0.0.1  port: 5433  db: postgres  user: gaussdb
#   password: 由本目录 .env 注入（GS_PASSWORD=…，见 .env.example；不入库）
#
# 停止 / 重置（重置后下次 up 重新初始化，仍为 A 模式）：
#   docker compose -f golden/gaussdb-docker/docker-compose.yml down
#   docker compose -f golden/gaussdb-docker/docker-compose.yml down -v
services:
  gaussdb:
    image: opengauss/opengauss:5.0.0
    container_name: spinduck-gaussdb
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/spinduck/spinduck-entrypoint.sh"]
    command: ["gaussdb"]
    environment:
      # 口令从 .env 注入（缺失即启动失败，杜绝明文入库/默认口令静默生效）
      GS_PASSWORD: ${GS_PASSWORD:?GS_PASSWORD must be set (cp .env.example .env)}
      GS_NODENAME: spinduck_node
      GS_PORT: 5432
      GS_HOST_AUTH_METHOD: md5
      # 内存口径写死，不跟随宿主 MemTotal：镜像默认按宿主内存推导
      # max_process_memory（本机实测 12GB）与 shared_buffers（1GB），CI runner
      # 与开发机的推导值不同会让同一份语料参照侧行为漂移，且实例总内存超过
      # deploy 限额时是内核直接 OOM kill（客户端只看到 "connection closed"）。
      #
      # 口径取 4GB/512MB + 限额 6GB 的依据（实测，validation V21.8）：同一份语料
      # 跑全量 gauss 套件，容器 cgroup 内存峰值 linux/amd64 1.74GB、
      # linux/arm64 1.10GB——2GB 预算 + 3GB 限额的余量只剩 ~1.7 倍，runner 上
      # 任何放大都会踩线，而 runner 有 16GB 内存，没有必要把参照实例卡这么紧。
      #
      # 注意：启动日志里的 "Failed to initialize the memory protect for
      # cstore_buffers (512 Mbytes) ..." 与小口径同行出现——实测写死 2GB/4GB 时
      # 必打印，不写死（跟随宿主 12GB）时不打印。也就是说一旦我们把预算写死，
      # openGauss 的实例级内存看护就是关着的：超限不会被拦成可读 SQL 错误，而是
      # 直接被内核杀掉（客户端只剩 "[ENV-0020] connection closed"）。这是限额
      # 必须明显高于预算的理由，不是可以忽略的噪声。
      #
      # 生效条件（易踩）：OTHER_PG_CONF 只在**空数据目录首次 initdb** 时追加进
      # postgresql.conf（镜像 entrypoint 的 opengauss_setup_postgresql_conf 位于
      # `if [ -z "$DATABASE_ALREADY_EXISTS" ]` 分支内）。改这几行必须 `down -v`
      # 重建卷，或手工追加到 $PGDATA/postgresql.conf 末尾后重建容器——两者都是
      # postmaster 级参数，reload 不够。
      OTHER_PG_CONF: "password_encryption_type = 1\nmax_process_memory = 4GB\nshared_buffers = 512MB"
    ports:
      # 仅回环：开发机不向局域网暴露 A 模式实例
      - "127.0.0.1:5433:5432"
    volumes:
      - gauss_data:/var/lib/opengauss/data
      - ./spinduck-entrypoint.sh:/spinduck/spinduck-entrypoint.sh:ro
    healthcheck:
      # 仅当 datcompatibility=A 才 healthy（防止未来镜像默认漂移被静默放过）
      test:
        [
          "CMD-SHELL",
          "export LD_LIBRARY_PATH=/usr/local/opengauss/lib:$$LD_LIBRARY_PATH && /usr/local/opengauss/bin/gsql -U gaussdb -W $$GS_PASSWORD -d postgres -t -A -c \"SELECT datcompatibility FROM pg_database WHERE datname = current_database()\" | tr -d '[:space:]' | grep -qx A",
        ]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 40s
    deploy:
      resources:
        # 限额 6G 必须明显高于 max_process_memory 4GB：本镜像的实例级内存看护
        # 起不来（见上方注释），超限不会被拦成可读 SQL 错误，而是内核直接杀掉
        # 后端进程——客户端只剩 "[ENV-0020] connection closed"。留足余量让这种事
        # 不发生，才是可诊断的前提（validation V21.8）。
        limits:
          memory: 6G
        reservations:
          memory: 1G

volumes:
  gauss_data:
    driver: local
