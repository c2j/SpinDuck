# 研发态项目声明（§12.1 项目模式唯一入口）。
[project]
name = "case_corpus_hz_byfund"
kernel = "1.5.5"

[paths]
ddl = "sql/ddl"                    # 表在 ddl/，视图在 ddl/views/（按依赖顺序重试建）
routines = "sql/routines"          # 过程/函数/PACKAGE 源码（逐字基线副本）
stubs = ["sql/stubs"]              # 外部依赖桩包
rules = ["rules/spinduck-rules.toml"]
probes = "probes"
home = ".spinduck"

[cases]
datasets = "cases/datasets"
baselines = "cases/baselines"
include = ["cases/*.case.toml"]

[engine]
threads = 4
